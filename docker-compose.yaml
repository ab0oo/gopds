services:
  gopds:
    build: .
    image: ghcr.io/ab0oo/gopds:latest
    container_name: gopds
    user: "33:33" # Use your actual host UID:GID, this needs to be the owner of the book library for writes
    ports:
      - "8880:8880"
    environment:
      - BOOK_PATH=/app/books
      - DB_PATH=/app/data/gopds.db
      - CATEGORY_SOURCE=subject
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      # Email Book (Send to Kindle); leave SMTP_SERVER unset to turn it off
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
       - /var/www/books:/app/books
       - /var/lib/gopds:/app/data
#      - /share/Multimedia/books:/app/books       # Read-write if you want to use the GUI for metadata changes
#      - /share/Multimedia/config/gopds:/app/data # Read-write for DB and covers
    restart: unless-stopped
